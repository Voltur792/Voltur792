name: Refresh issue board and alert Telegram

on:
  schedule:
    # GitHub can delay scheduled runs under load; worst case is closer to an hour.
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: refresh-issue-board
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Update issue block and alert new issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_issues_block.py
      - name: Publish changed profile
        run: |
          if git diff --quiet -- README.md; then
            echo 'Issue board is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh profile issue board'
          git pull --rebase origin main
          git push origin HEAD:main
